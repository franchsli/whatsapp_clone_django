{% extends "layouts/base.html" %}
{% block title %}Home{% endblock title %}
{% load static %}

{% block content %}
{% if request.user.is_authenticated %}
{% comment %} <h1>Hola {{ user }}</h1>
<a href="{% url 'exit' %}">log out</a> {% endcomment %}


<div class="card mt-3 mb-3" id="base">
  <div class="card-body">
    <div class="row">
        <div class="col-4 border border-black" id="chats-and-more">

        </div>
        <div class="col-8 border border-black" id="chat-diplay">

        </div>
    </div>
  </div>
</div>

{% else %}
<h1>Log in</h1>
<a href="{% url 'login' %}"></a>
{% endif %}



{% endblock content %}
