<!-- ========== Inside modal content ========== -->
<div class="status-container">
    <!-- Status carousel -->
    <div id="statusCarousel" class="carousel slide" data-bs-interval="false">
        <div class="carousel-inner">
            <!--Statuses-->
            {% for status in statuses %}
                <div class="status-container carousel-item">
                    <img src="https://picsum.photos/450/800" alt="Status 1" class="status-content">
                    <div class="status-text-overlay">
                        <p class="status-text">Having a great time! 🌞</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Header with progress and user info -->
    <div class="status-header">
        <!-- Progress bars -->
        <div class="progress-container">
            {% for status in statuses %}
                    <div class="status-progress">
                        <div class="status-progress-bar"></div>
                    </div>  
            {% endfor %}
                    
        </div>
        
        <!-- User info -->
        <div class="d-flex align-items-center">
            <button class="btn text-white me-2">
                <i class="bi bi-arrow-left"></i>
            </button>
            <img src="https://picsum.photos/50/" alt="User Avatar" class="avatar me-2">
            <div class="flex-grow-1">
                <p class="username">Username</p>
                <p class="timestamp">2 hours ago</p>
            </div>
            <button class="btn text-white">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
        </div>
    </div>

    <!-- Reply input area -->
    <div class="status-actions">
        <input type="text" class="status-input" placeholder="Reply to status...">
        <button class="btn text-white">
            <i class="bi bi-arrow-up-circle-fill"></i>
        </button>
    </div>

    <!-- Touch areas for navigation -->
    <button class="carousel-control-prev" type="button" data-bs-target="#statusCarousel" data-bs-slide="prev"></button>
    <button class="carousel-control-next" type="button" data-bs-target="#statusCarousel" data-bs-slide="next"></button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const carousel = document.getElementById('statusCarousel');
        const progressBars = document.querySelectorAll('.status-progress');
        const statusDuration = 5000; // 5 seconds per status
        let currentStatus = 0;
        let statusTimer;

        function startStatusTimer() {
            const progressBar = progressBars[currentStatus].querySelector('.status-progress-bar');
            let progress = 0;
            clearInterval(statusTimer);
            
            statusTimer = setInterval(() => {
                progress += 1;
                progressBar.style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(statusTimer);
                    progressBars[currentStatus].classList.add('viewed');
                    
                    if (currentStatus < progressBars.length - 1) {
                        currentStatus++;
                        carousel.querySelector('.carousel-control-next').click();
                        startStatusTimer();
                    }
                }
            }, statusDuration / 100);
        }

        startStatusTimer();

        carousel.addEventListener('slide.bs.carousel', function(event) {
            clearInterval(statusTimer);
            currentStatus = event.to;
            startStatusTimer();
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(statusTimer);
            } else {
                startStatusTimer();
            }
        });
    });
</script>
