{% load static %}
{% load filters %}
<li class="list-group-item p-3  d-flex flex-inline align-items-center contact" role="button" data-contact={{contact.id}}
  hx-target="this" hx-swap="outerHTML">
  {% comment "contact profile photo" %}{% endcomment %}
  <img class="ms-1 rounded-circle img-fluid" src="{% get_contact_photo contact.phone_number %}" alt=""
    style="max-width: 45px;">
  <div class="d-flex flex-column ms-3 w-100">
    <div class="d-flex justify-content-between">
      <span class="contact-name">{{ contact.name }}</span>
      <button class="btn btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
        onclick="run_element_animation(this.nextElementSibling)"></button>
      <ul class="dropdown-menu animated-dropdown">
        <li><span class="dropdown-item delete-action" hx-delete="{% url 'delete_contact' contact.id %}"
            hx-confirm="Are you sure you want to delete this contact?" hx-swap="outerHTML" hx-target="#contact-list"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'><i class="bi bi-trash3"></i> Delete contact</span></li>
        <li><span class="dropdown-item edit-action" hx-get="{% url 'edit_contact' contact.id %}"><i
              class="bi bi-pencil-square"></i> Edit contact</span></li>
      </ul>
    </div>
  </div>
</li>
