{% load static %}


    <div class="p-2" hx-target="this" hx-swap="outerHTML">
      {% if message.has_image %}
        <img class="mw-100 mh-100" src="{{message.image.url}}" alt="">
      {% else %}
        <img class="mw-100 mh-100" src="undefined" alt="">
      {% endif %}
      <span>{{message.text}}</span>
      <button class="btn btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: var(--bs-success-bg-subtle); align-self: self-end;"></button>      
      <ul class="dropdown-menu">
        <li><span class="dropdown-item edit-action" hx-get="{% url 'edit_message' message.id %}"><i class="bi bi-pencil-square"></i> Edit message</span></li>
        <li><span class="dropdown-item delete-action delete-message" hx-delete="{% url 'delete_message' chat.id message.id %}" hx-target="#chat-messages" hx-swap="outerHTML" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>Delete</span></li>
      </ul>
    </div>
