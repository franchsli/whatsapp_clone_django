{% load static %}

<ul class="scroll-section list-unstyled flex-column overflow-y-scroll" id="chat-messages">
  {% for message in messages %}
  <!-- ========== MESSAGE DATE  ========== -->
    <div class="message-date d-flex justify-content-center rounded-pill bg-body-tertiary"
    style="width: fit-content; align-self: center;">
      <span class="p-2">{{message.date|date:"D d M Y"}}</span>
    </div>
  
  {% if message.sender_user == request.user %}
  <li class="list-unstyled-item me-3 mt-3 rounded message user-message dropdown"
    oncontextmenu="showDropdown(event, 'customDropdown-{{message.id}}')">
    {% else %}
  <li class="list-unstyled-item ms-3 mt-3 rounded message contact-message">
    {% endif %}
    {% include "layouts/partials/components/message.html" %}
  </li>
  {% endfor %}
</ul>
